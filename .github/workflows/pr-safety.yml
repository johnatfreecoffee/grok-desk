# Autonomous PR review: scans the diff and posts a simple-English comment.
name: PR safety review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for diff
        run: git fetch origin "${{ github.base_ref }}" --depth=100

      - name: Write PR diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run safety review
        id: review
        env:
          MODE: check
          PR_DIFF_FILE: /tmp/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          node scripts/pr-safety-review.mjs > /tmp/review.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/review.md
          # Always upload body for comment; hard fail marks job failure later
          if [ "$code" -eq 2 ]; then
            echo "::error::Hard safety flags (secrets / private keys / dangerous exec). See review."
          fi
          exit 0

      - name: Comment on PR (simple English)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            const marker = '<!-- grok-desk-auto-review -->';
            const full = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && String(c.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
            }

      - name: Fail job on hard flags
        if: steps.review.outputs.exit_code == '2'
        run: exit 1
