# Autonomous PR review: scans the diff and posts a simple-English comment.
name: PR safety review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for diff
        run: git fetch origin "${{ github.base_ref }}" --depth=100

      - name: Write PR diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run safety review
        id: review
        env:
          MODE: check
          PR_DIFF_FILE: /tmp/pr.diff
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          node scripts/pr-safety-review.mjs > /tmp/review.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/review.md
          # Always upload body for comment; hard fail marks job failure later
          if [ "$code" -eq 2 ]; then
            echo "::error::Hard safety flags (secrets / private keys / dangerous exec). See review."
          fi
          exit 0

      - name: Comment on PR (simple English)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/review.md', 'utf8');
            const marker = '<!-- grok-desk-auto-review -->';
            const full = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c =>
              c.user?.type === 'Bot' && String(c.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
            }

      - name: Email John (Agent Mail / Resend)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          REPLY_TO: e.grokdesk@freecoffee.dev
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HARD: ${{ steps.review.outputs.exit_code }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret not set — skip email"
            exit 0
          fi
          export NOTIFY_FROM="${NOTIFY_FROM:-Grok Desk <e.grokdesk@freecoffee.dev>}"
          export NOTIFY_TO="${NOTIFY_TO:-johnfrankromanojr@gmail.com}"
          FLAG="OK"
          if [ "${HARD}" = "2" ]; then FLAG="STOP"; fi
          SUBJECT="[Grok Desk PR #${PR_NUM}] ${FLAG}: ${PR_TITLE}"
          {
            echo "Grok Desk auto-reviewed a pull request."
            echo ""
            echo "PR: #${PR_NUM} — ${PR_TITLE}"
            echo "Author: @${PR_AUTHOR}"
            echo "Link: ${PR_URL}"
            echo "Verdict flag: ${FLAG}"
            echo ""
            echo "—— review (simple English) ——"
            echo ""
            cat /tmp/review.md
            echo ""
            echo "—— how to reply ——"
            echo "Reply to this email (to e.grokdesk@freecoffee.dev)."
            echo "Agent Mail will pick it up (trusted: your Gmail) and can work in the grok-desk repo."
            echo "Or merge/comment on GitHub: ${PR_URL}"
          } > /tmp/email-body.txt
          SUBJECT="$SUBJECT" BODY_FILE=/tmp/email-body.txt node scripts/mail-notify.mjs

      - name: Fail job on hard flags
        if: steps.review.outputs.exit_code == '2'
        run: exit 1
