name: Pack installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx --yes electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: grok-desk-linux
          path: dist-electron/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx --yes electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: grok-desk-windows
          path: dist-electron/*
