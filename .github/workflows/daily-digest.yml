# Wake-up email every day — always sends, even if the repo was quiet.
name: Daily digest

on:
  schedule:
    # 12:00 UTC ≈ 8am Eastern / 7am Central
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install gh is preinstalled
        run: gh --version

      - name: Build daily digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: johnatfreecoffee/grok-desk
          OUT_BODY: /tmp/gd-daily-body.txt
          OUT_SUBJECT: /tmp/gd-daily-subject.txt
        run: node scripts/daily-repo-digest.mjs

      - name: Email John (always)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          REPLY_TO: e.grokdesk@freecoffee.dev
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY missing — cannot email"
            exit 1
          fi
          export NOTIFY_FROM="${NOTIFY_FROM:-Grok Desk <e.grokdesk@freecoffee.dev>}"
          export NOTIFY_TO="${NOTIFY_TO:-johnfrankromanojr@gmail.com}"
          SUBJECT=$(cat /tmp/gd-daily-subject.txt)
          SUBJECT="$SUBJECT" BODY_FILE=/tmp/gd-daily-body.txt node scripts/mail-notify.mjs
