# Autonomous fork watch — weekly summary issue + email to John.
name: Forks watch

# Superseded for "wake up" mail by daily-digest.yml (every day).
# Kept for manual / optional Monday extra pulse.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: forks } = await github.rest.repos.listForks({
              owner, repo, sort: 'newest', per_page: 30,
            });
            const { data: pulls } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 20,
            });

            const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
            const newForks = forks.filter(f => new Date(f.created_at).getTime() >= weekAgo);

            let body = `## Weekly open-source pulse (simple English)\n\n`;
            body += `**Repo:** ${owner}/${repo}\n\n`;
            body += `### Forks\n`;
            body += `- Total forks: **${forks.length}**\n`;
            body += `- New in last 7 days: **${newForks.length}**\n`;
            if (newForks.length) {
              body += newForks.map(f =>
                `- @${f.owner.login} → ${f.html_url} (created ${f.created_at.slice(0,10)})`
              ).join('\n') + '\n';
            } else {
              body += `- Nobody new forked this week (that’s normal early on).\n`;
            }
            body += `\n### Open pull requests\n`;
            if (!pulls.length) {
              body += `- None open. You’re caught up.\n`;
            } else {
              body += pulls.map(p =>
                `- #${p.number} ${p.title} (from @${p.user.login}) ${p.html_url}`
              ).join('\n') + '\n';
              body += `\n**What to do:** open each PR → read the **Auto review** comment → merge only if it looks good and CI is green.\n`;
            }
            body += `\n### Remember\n`;
            body += `- Forks are **copies**. People can’t edit your \`main\` unless you merge a PR.\n`;
            body += `- Reply to the notification email at e.grokdesk@freecoffee.dev to talk to Agent Mail about the repo.\n`;
            body += `\n<sub>Automated by forks-watch.yml · <!-- grok-desk-forks-watch --></sub>\n`;

            const title = `OSS pulse · ${new Date().toISOString().slice(0, 10)}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'oss-pulse' });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: 'oss-pulse', color: '0ea5e9',
                description: 'Automated weekly open-source activity',
              });
            }

            const issue = await github.rest.issues.create({
              owner, repo, title, body, labels: ['oss-pulse'],
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/pulse-body.md', body + `\n\nIssue: ${issue.data.html_url}\n`);
            fs.writeFileSync('/tmp/pulse-subject.txt', `[Grok Desk] ${title}`);

      - name: Email John (weekly pulse)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          REPLY_TO: e.grokdesk@freecoffee.dev
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret not set — skip email"
            exit 0
          fi
          export NOTIFY_FROM="${NOTIFY_FROM:-Grok Desk <e.grokdesk@freecoffee.dev>}"
          export NOTIFY_TO="${NOTIFY_TO:-johnfrankromanojr@gmail.com}"
          SUBJECT=$(cat /tmp/pulse-subject.txt)
          SUBJECT="$SUBJECT" BODY_FILE=/tmp/pulse-body.md node scripts/mail-notify.mjs
